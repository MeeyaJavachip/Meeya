<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fffaf0">
    <title>Social feed — green signal | Howl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="a3.css">
  </head>
  <body class="variant-a3">
    <div class="app-shell">
      <header class="side-nav">
        <a class="brand" href="index.html">Howl</a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="#feed" aria-current="page">Feed</a>
          <a href="#places">Places</a>
        </nav>
        <section class="profile" id="profile" aria-label="Your profile">
          <span class="avatar" aria-hidden="true">MR</span>
          <div><span class="profile-name">Maya R.</span><span class="profile-context">NC State student</span></div>
        </section>
      </header>
      <main class="feed-column" id="feed">
        <header class="feed-heading"><h1>Sidewalk Notes</h1><p>Small moments from around campus.</p></header>
        <section data-feed aria-label="Campus posts"></section>
      </main>
      <aside class="place-rail" id="places"><h2>Places in the feed</h2><nav class="place-list" data-places aria-label="Jump to a place"></nav></aside>
    </div>
    <script src="../01-directions/posts.js"></script>
    <script src="social.js"></script>
  </body>
</html>
